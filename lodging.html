<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lodging | MT-Mate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="lodging">
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="index.html"><span class="logo-mark">MT</span><span>MT-Mate</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="participants.html">Participants</a><a href="lodging.html">Lodging</a><a href="transport.html">Transport</a><a href="schedule.html">Schedule</a><a href="budget.html">Budget</a><a href="games.html">Games</a><a href="checklist.html">Checklist</a><a href="roles.html">Roles</a></div>
      <button id="themeToggle" class="theme-toggle" aria-label="테마 변경">🌙</button>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <h1>Lodging</h1>
      <p>지역별 숙소 후보와 가격, 추가 인원 요금, 방/화장실, 특징, 링크를 비교합니다.</p>
    </section>
    
<section class="section">
  <form id="lodgingForm" class="form-card">
    <div class="form-grid four">
      <div><label>숙소명</label><input name="name" required placeholder="예: 가평 ○○펜션"></div>
      <div><label>지역</label><input name="region" required placeholder="가평 / 대부도 / 양평"></div>
      <div><label>숙소 링크</label><input name="link" placeholder="https://..."></div>
      <div><label>평점</label><input name="score" type="number" min="0" max="10" value="7"></div>
      <div><label>기준 가격</label><input name="basePrice" type="number" value="0"></div>
      <div><label>기준 인원</label><input name="basePeople" type="number" value="0"></div>
      <div><label>추가 1인 요금</label><input name="extraFee" type="number" value="0"></div>
      <div><label>예상 인원</label><input name="expectedPeople" type="number" value="0"></div>
      <div><label>숙박 일수</label><input name="nights" type="number" value="1"></div>
      <div><label>방 개수</label><input name="rooms" type="number" value="0"></div>
      <div><label>화장실 개수</label><input name="baths" type="number" value="0"></div>
      <div><label>시설/특징</label><input name="features" placeholder="바베큐, 수영장, 노래방"></div>
      <div class="full"><label>장점</label><input name="pros" placeholder="가격 저렴, 단체 이용 가능, 역과 가까움"></div>
      <div class="full"><label>단점</label><input name="cons" placeholder="추가금 있음, 방음 약함, 대중교통 불편"></div>
    </div>
    <div class="actions"><button class="btn" type="submit">숙소 후보 추가</button></div>
  </form>
  <div class="tool-row"><select id="regionFilter"></select><select id="lodgingSort"><option value="none">정렬 없음</option><option value="price">가격 낮은 순</option><option value="score">점수 높은 순</option><option value="people">예상 인원 많은 순</option></select></div>
  <div id="lodgingList" class="item-list"></div>
</section>

  </main>
  <footer class="footer">MT-Mate · 학생회와 동아리를 위한 MT 기획 관리 웹앱</footer>
  <script src="script.js"></script>
</body>
</html>
