<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transport | MT-Mate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="transport">
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="index.html"><span class="logo-mark">MT</span><span>MT-Mate</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="participants.html">Participants</a><a href="lodging.html">Lodging</a><a href="transport.html">Transport</a><a href="schedule.html">Schedule</a><a href="budget.html">Budget</a><a href="games.html">Games</a><a href="checklist.html">Checklist</a><a href="roles.html">Roles</a></div>
      <button id="themeToggle" class="theme-toggle" aria-label="테마 변경">🌙</button>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <h1>Transport</h1>
      <p>택시비 지원, 버스 대절, 개별 이동 등 교통비를 정리합니다.</p>
    </section>
    
<section class="section">
  <div class="summary-grid"><div class="summary-card"><span>총 교통비</span><strong id="transportTotal">0원</strong></div><div class="summary-card"><span>총 지원금</span><strong id="transportSupport">0원</strong></div></div>
  <form id="transportForm" class="form-card">
    <div class="form-grid four">
      <div><label>교통 방식</label><select name="method"><option>버스 대절</option><option>택시비 지원</option><option>개별 이동</option><option>기차/고속버스</option></select></div>
      <div><label>출발 지역</label><input name="from" placeholder="학교 / 역 / 터미널"></div>
      <div><label>도착 지역</label><input name="to" placeholder="숙소 / 목적지"></div>
      <div><label>예상 인원</label><input name="people" type="number" value="1"></div>
      <div><label>총 교통비</label><input name="totalCost" type="number" value="0"></div>
      <div><label>지원 금액</label><input name="supportCost" type="number" value="0"></div>
      <div class="full"><label>메모</label><input name="memo" placeholder="택시 팀 수, 버스 회사, 집합 장소 등"></div>
    </div>
    <div class="actions"><button class="btn" type="submit">교통비 항목 추가</button></div>
  </form>
  <div id="transportList" class="item-list section"></div>
</section>

  </main>
  <footer class="footer">MT-Mate · 학생회와 동아리를 위한 MT 기획 관리 웹앱</footer>
  <script src="script.js"></script>
</body>
</html>
