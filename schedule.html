<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule | MT-Mate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="schedule">
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="index.html"><span class="logo-mark">MT</span><span>MT-Mate</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="participants.html">Participants</a><a href="lodging.html">Lodging</a><a href="transport.html">Transport</a><a href="schedule.html">Schedule</a><a href="budget.html">Budget</a><a href="games.html">Games</a><a href="checklist.html">Checklist</a><a href="roles.html">Roles</a></div>
      <button id="themeToggle" class="theme-toggle" aria-label="테마 변경">🌙</button>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <h1>Schedule</h1>
      <p>MT 시간표를 날짜와 시간순으로 정리하고 인쇄할 수 있습니다.</p>
    </section>
    
<section class="section">
  <form id="scheduleForm" class="form-card">
    <div class="form-grid four">
      <div><label>날짜/일차</label><input name="day" placeholder="1일차 / 2026-07-10" required></div>
      <div><label>시작 시간</label><input name="start" type="time" required></div>
      <div><label>종료 시간</label><input name="end" type="time"></div>
      <div><label>일정 제목</label><input name="title" placeholder="숙소 입실" required></div>
      <div><label>장소</label><input name="place" placeholder="숙소 로비"></div>
      <div><label>담당자</label><input name="owner" placeholder="문화국 / 홍길동"></div>
      <div><label>준비물</label><input name="supplies" placeholder="명단, 마이크, 게임 카드"></div>
      <div><label>메모</label><input name="memo" placeholder="주의사항, 이동 안내"></div>
    </div>
    <div class="actions"><button class="btn" type="submit">일정 추가</button><button class="btn secondary" id="printSchedule" type="button">일정표 인쇄</button></div>
  </form>
  <div class="table-wrap section"><table><thead><tr><th>날짜/시간</th><th>일정</th><th>장소</th><th>담당</th><th>준비물</th><th>메모</th><th>관리</th></tr></thead><tbody id="scheduleTableBody"></tbody></table></div>
</section>

  </main>
  <footer class="footer">MT-Mate · 학생회와 동아리를 위한 MT 기획 관리 웹앱</footer>
  <script src="script.js"></script>
</body>
</html>
