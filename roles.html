<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roles | MT-Mate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="roles">
  <header class="site-header">
    <nav class="navbar">
      <a class="logo" href="index.html"><span class="logo-mark">MT</span><span>MT-Mate</span></a>
      <div class="nav-links"><a href="index.html">Home</a><a href="participants.html">Participants</a><a href="lodging.html">Lodging</a><a href="transport.html">Transport</a><a href="schedule.html">Schedule</a><a href="budget.html">Budget</a><a href="games.html">Games</a><a href="checklist.html">Checklist</a><a href="roles.html">Roles</a></div>
      <button id="themeToggle" class="theme-toggle" aria-label="테마 변경">🌙</button>
    </nav>
  </header>
  <main>
    <section class="page-title">
      <h1>Roles</h1>
      <p>MT 준비 업무를 담당자별로 나누고 진행 상태를 정리합니다.</p>
    </section>
    
<section class="section">
  <form id="roleForm" class="form-card">
    <div class="form-grid four">
      <div><label>이름</label><input name="name" placeholder="담당자 이름" required></div>
      <div><label>역할</label><input name="role" placeholder="숙소 / 회계 / 게임 / 명단" required></div>
      <div><label>마감일</label><input name="due" type="date"></div>
      <div><label>상태</label><select name="status"><option>진행 중</option><option>완료</option><option>확인 필요</option></select></div>
      <div class="full"><label>업무 내용</label><input name="task" placeholder="해야 할 일을 자세히 적어주세요."></div>
    </div>
    <div class="actions"><button class="btn" type="submit">역할 추가</button></div>
  </form>
  <div id="roleList" class="item-list section"></div>
</section>

  </main>
  <footer class="footer">MT-Mate · 학생회와 동아리를 위한 MT 기획 관리 웹앱</footer>
  <script src="script.js"></script>
</body>
</html>
